name: Build Android APK (Flutter M5)

on:
  push:
    branches:
      - main
      - 'm[0-9]+-**'
      - 'm*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Flutter Analyze, Test, & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android platform scaffolding & inject INTERNET permission
        working-directory: apps/mobile
        run: |
          rm -rf /tmp/jr_lib /tmp/jr_test
          cp -r lib /tmp/jr_lib
          cp -r test /tmp/jr_test
          cp pubspec.yaml /tmp/jr_pubspec.yaml
          cp analysis_options.yaml /tmp/jr_analysis_options.yaml

          flutter create --platforms=android --org id.nusantara.jalurrempah --project-name jalur_rempah_mobile .

          cp -r /tmp/jr_lib/* lib/
          cp -r /tmp/jr_test/* test/
          cp /tmp/jr_pubspec.yaml pubspec.yaml
          cp /tmp/jr_analysis_options.yaml analysis_options.yaml

          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, "r", encoding="utf-8").read()
          perms = (
              "    <uses-permission android:name=\"android.permission.INTERNET\" />\n"
              "    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n"
          )
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", perms + "    <application", 1)
          open(p, "w", encoding="utf-8").write(s)
          '

          echo "=== Verifikasi isi android/app/src/main/AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml

          flutter pub get

      - name: Run flutter analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run flutter widget tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build release APK
        working-directory: apps/mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.bacanova.my.id

      - name: Generate Debug Keystore and Print SHA-1
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android 
      - name: Verify compiled APK permissions with aapt
        working-directory: apps/mobile
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name "aapt" | sort -V | tail -n 1)
          echo "Using aapt: $AAPT"
          PERMS=$("$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk)
          echo "=== Daftar Permission di dalam app-release.apk ==="
          echo "$PERMS"
          echo "$PERMS" | grep -q "android.permission.INTERNET" || {
            echo "FATAL: android.permission.INTERNET tidak ditemukan di dalam APK!"
            exit 1
          }

      - name: Upload Release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jalur-rempah-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
