name: CI

on:
  push:
    branches:
      - main
      - 'm[0-9]+-**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Lint, Typecheck, & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jalur_rempah_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: jalur_rempah_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://jalur_rempah_test:test_password@localhost:5432/jalur_rempah_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm -w test

      - name: Smoke test db:migrate on separate empty database
        env:
          SMOKE_DB_URL: postgres://jalur_rempah_test:test_password@localhost:5432/jalur_rempah_smoke
        run: |
          pnpm --filter @jalur-rempah/api exec node --input-type=module -e "
            import pg from 'pg';
            const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            await client.query('DROP DATABASE IF EXISTS jalur_rempah_smoke;');
            await client.query('CREATE DATABASE jalur_rempah_smoke;');
            await client.end();
          "
          DATABASE_URL="$SMOKE_DB_URL" pnpm db:migrate
