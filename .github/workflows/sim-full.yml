name: Economy Simulation (Full)

on:
  workflow_dispatch:
    inputs:
      ticks:
        description: 'Jumlah tick simulasi'
        required: false
        default: '10000'
      bots:
        description: 'Jumlah bot'
        required: false
        default: '50'
      seeds:
        description: 'Daftar seed dipisahkan koma'
        required: false
        default: '101,202,303,404,505'
      long_horizon_ticks:
        description: 'Jumlah tick simulasi horizon panjang (0 untuk lewati)'
        required: false
        default: '200000'
      long_horizon_bots:
        description: 'Jumlah bot simulasi horizon panjang'
        required: false
        default: '15'

jobs:
  simulate-economy:
    name: Full Economy Simulation & Invariant Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full simulation and print JSON metrics
        env:
          SIM_TICKS: ${{ inputs.ticks || '10000' }}
          SIM_BOTS: ${{ inputs.bots || '50' }}
          SIM_SEEDS: ${{ inputs.seeds || '101,202,303,404,505' }}
        run: |
          pnpm sim:run --ticks "$SIM_TICKS" --bots "$SIM_BOTS" --seed "$SIM_SEEDS" --out sim-metrics-full.json

      - name: Run long-horizon 200k-tick stability simulation
        env:
          LONG_TICKS: ${{ inputs.long_horizon_ticks || '200000' }}
          LONG_BOTS: ${{ inputs.long_horizon_bots || '15' }}
        run: |
          if [ "$LONG_TICKS" -gt 0 ]; then
            pnpm sim:run --ticks "$LONG_TICKS" --bots "$LONG_BOTS" --seed "101" --out sim-metrics-200k.json
          fi

      - name: Upload simulation metrics JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economy-simulation-metrics
          path: |
            sim-metrics-full.json
            sim-metrics-200k.json
